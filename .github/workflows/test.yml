# Runs the integrity checks and the test suite on every push and pull request.
#
# Nothing here touches a live site or an API: the tests use local fixtures and mock servers, so no secrets are needed.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version the scripts promise to support.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile the scripts
        run: python -m py_compile plugins/seo-pro/skills/seo-pro/scripts/*.py tools/*.py

      - name: Integrity checks (practice IDs, paths, links, tables, manifests)
        run: python tools/check_skill.py

      - name: Test suite
        run: python -m unittest discover -s tests -v
