# Checks the scripts and the plugin manifests on every push and pull request.
#
# Nothing here touches a live site or an API: no secrets needed.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version the scripts promise to support.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile the scripts
        run: python -m py_compile plugins/seo-pro/skills/seo-pro/scripts/*.py

      - name: Scripts start and print their help
        run: |
          python plugins/seo-pro/skills/seo-pro/scripts/seo_audit.py --help > /dev/null
          python plugins/seo-pro/skills/seo-pro/scripts/search_data.py --help > /dev/null

      - name: Manifests are valid JSON
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool plugins/seo-pro/.claude-plugin/plugin.json > /dev/null
          python -m json.tool evals/evals.json > /dev/null
